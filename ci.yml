name: Sales Analytics CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest test_analysis.py -v
      - name: Rebuild analytics outputs in temporary directory
        run: python analyze_sales.py --input sales_transactions_sample.csv --source-label "CI synthetic sample" --output-dir "$RUNNER_TEMP/sales-analytics-output"
      - name: Check dashboard JavaScript syntax
        run: node --check dashboard.js
